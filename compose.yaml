name: labquality
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: labquality
      POSTGRES_USER: labquality
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U labquality -d labquality"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      LQ_DATABASE_URL: postgresql+psycopg://labquality:${POSTGRES_PASSWORD}@db:5432/labquality
      LQ_STORAGE_DIR: /data/storage
    volumes:
      - evidence_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    command: [python, -m, app.worker]
    env_file: .env
    environment:
      LQ_DATABASE_URL: postgresql+psycopg://labquality:${POSTGRES_PASSWORD}@db:5432/labquality
      LQ_STORAGE_DIR: /data/storage
    volumes:
      - evidence_data:/data/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      LQ_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  evidence_data:
