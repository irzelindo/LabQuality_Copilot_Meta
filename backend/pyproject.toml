[project]
name = "labquality-copilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6",
  "pydantic==2.14.1", "pydantic-settings==2.16.1", "psycopg[binary]==3.3.6",
  "httpx==0.28.1", "python-multipart==0.0.32", "pwdlib[argon2]==0.3.1",
  "alembic==1.20.1", "openpyxl==3.1.5"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
